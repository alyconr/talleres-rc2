[project]
name = "talleres-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aio-pika==10.2.3",
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "fastapi==0.128.0",
    "httpx==0.28.1",
    "sqlalchemy==2.0.49",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Cadena de suministro [SLSA 1.2, OWASP A03:2025, CWE-829]: no resolver versiones publicadas en los últimos 7 días.
# Fuente: https://docs.astral.sh/uv/concepts/resolution/#dependency-cooldowns
[tool.uv]
exclude-newer = "7 days"
